<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Adventure - Optimized</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background: #1a1a2e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #health-bar {
      display: flex;
      gap: 4px;
    }

    .heart {
      width: 24px;
      height: 24px;
      background: #e74c3c;
      clip-path: polygon(50% 15%, 61% 6%, 75% 0%, 89% 6%, 100% 21%, 100% 39%, 50% 100%, 0% 39%, 0% 21%, 11% 6%, 25% 0%, 39% 6%);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }

    .heart.empty {
      background: #555;
      opacity: 0.4;
    }

    #score-display {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    #game-over-screen,
    #victory-screen,
    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 24px;
      pointer-events: auto;
    }

    .screen-title {
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .screen-subtitle {
      color: #cbd5e1;
      font-size: 18px;
    }

    #start-btn,
    .screen-btn {
      padding: 14px 40px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      background: #667eea;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(102,126,234,0.5);
      transition: transform 0.1s ease, background 0.2s ease;
      pointer-events: auto;
    }

    #start-btn:hover,
    .screen-btn:hover {
      background: #764ba2;
      transform: translateY(-2px);
    }

    #start-btn:active,
    .screen-btn:active {
      transform: translateY(0);
    }

    .hidden {
      display: none !important;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div id="hud">
        <div id="health-bar">
          <div class="heart"></div>
          <div class="heart"></div>
          <div class="heart"></div>
        </div>
        <div id="score-display">Score: 0</div>
      </div>

      <div id="start-screen">
        <h1 class="screen-title">Platform Adventure</h1>
        <p class="screen-subtitle">Collect coins &middot; Avoid enemies &middot; Reach the flag</p>
        <button id="start-btn" type="button">Start Game</button>
      </div>

      <div id="game-over-screen" class="hidden">
        <h1 class="screen-title">Game Over</h1>
        <p class="screen-subtitle">You ran out of hearts.</p>
        <button id="restart-btn" class="screen-btn" type="button">Restart</button>
      </div>

      <div id="victory-screen" class="hidden">
        <h1 class="screen-title">Victory!</h1>
        <p class="screen-subtitle">You reached the flag.</p>
        <button id="play-again-btn" class="screen-btn" type="button">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // ===== game.js (entry / bootstrap) =====

      const GAME_W = 800;
      const GAME_H = 600;
      const GROUND_TOP = 560;
      const GRAVITY = 1400;
      const MOVE_SPEED = 300;
      const JUMP_VELOCITY = -560;
      const MAX_JUMPS = 2;
      const MAX_HEALTH = 3;
      const INVINCIBLE_MS = 1000;

      let game = null;
      let gameStarted = false;

      function hideScreen(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      }

      function showScreen(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('hidden');
      }

      function renderHealth(health) {
        const hearts = document.querySelectorAll('#health-bar .heart');
        hearts.forEach(function (h, i) {
          if (i < health) h.classList.remove('empty');
          else h.classList.add('empty');
        });
      }

      function renderScore(score) {
        const el = document.getElementById('score-display');
        if (el) el.textContent = 'Score: ' + score;
      }

      class GameScene extends Phaser.Scene {
        constructor() {
          super('game');
        }

        create() {
          this.health = MAX_HEALTH;
          this.score = 0;
          this.jumps = 0;
          this.invincibleUntil = 0;

          // Ground
          const ground = this.add.rectangle(GAME_W / 2, GROUND_TOP + 20, GAME_W, 40, 0x334155);
          this.physics.add.existing(ground, true);

          // Static platforms
          this.platforms = this.physics.add.staticGroup();
          this.platforms.add(ground);
          const specs = [
            [200, 440, 180, 20],
            [420, 360, 180, 20],
            [620, 280, 160, 20],
            [300, 200, 140, 20],
          ];
          specs.forEach((p) => {
            const rect = this.add.rectangle(p[0], p[1], p[2], p[3], 0x64748b);
            this.physics.add.existing(rect, true);
            this.platforms.add(rect);
          });

          // Player
          this.player = this.add.rectangle(100, GROUND_TOP - 25, 36, 50, 0x38bdf8);
          this.physics.add.existing(this.player);
          this.player.body.setCollideWorldBounds(true);
          this.player.body.setGravityY(GRAVITY);
          this.player.body.setMaxVelocity(600, 1600);

          this.physics.add.collider(this.player, this.platforms);

          // Coins
          this.coins = this.physics.add.group();
          const coinPositions = [
            [200, 400], [460, 310], [660, 240], [340, 160], [120, 520], [720, 520],
          ];
          coinPositions.forEach((c) => {
            const coin = this.add.circle(c[0], c[1], 10, 0xfbbf24);
            this.physics.add.existing(coin);
            coin.body.setAllowGravity(false);
            this.coins.add(coin);
          });
          this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);

          // Enemies (patrol between min/max)
          this.enemies = this.physics.add.group();
          const enemySpecs = [
            { x: 300, y: GROUND_TOP - 17, min: 180, max: 620 },
            { x: 420, y: 350 - 17, min: 335, max: 505 },
            { x: 620, y: 270 - 17, min: 545, max: 695 },
          ];
          enemySpecs.forEach((e) => {
            const enemy = this.add.rectangle(e.x, e.y, 34, 34, 0xef4444);
            this.physics.add.existing(enemy);
            enemy.body.setGravityY(GRAVITY);
            enemy.patrol = e;
            this.enemies.add(enemy);
          });
          this.physics.add.collider(this.enemies, this.platforms);
          this.physics.add.overlap(this.player, this.enemies, this.hitByEnemy, null, this);

          // Goal flag
          this.goal = this.add.rectangle(GAME_W - 40, GROUND_TOP - 30, 16, 60, 0x22c55e);
          this.physics.add.existing(this.goal, true);
          this.physics.add.overlap(this.player, this.goal, this.reachGoal, null, this);

          // Keyboard
          this.cursors = this.input.keyboard.createCursorKeys();
          const kb = this.input.keyboard;
          this.leftKeys = [this.cursors.left, kb.addKey('A')];
          this.rightKeys = [this.cursors.right, kb.addKey('D')];
          this.jumpKeys = [this.cursors.space, this.cursors.up, kb.addKey('W'), kb.addKey('Z')];

          renderHealth(this.health);
          renderScore(this.score);
          console.log('[game] scene created');
        }

        isDown(keys) {
          for (let i = 0; i < keys.length; i++) {
            if (keys[i].isDown) return true;
          }
          return false;
        }

        tryJump() {
          if (this.jumps >= MAX_JUMPS) return false;
          this.jumps += 1;
          this.player.body.setVelocityY(JUMP_VELOCITY);
          return true;
        }

        collectCoin(_player, coin) {
          coin.destroy();
          this.score += 10;
          renderScore(this.score);
        }

        hitByEnemy(player, enemy) {
          const now = this.time.now;
          if (now < this.invincibleUntil) return;
          this.health -= 1;
          this.invincibleUntil = now + INVINCIBLE_MS;
          renderHealth(this.health);
          const dir = player.x < enemy.x ? -1 : 1;
          player.body.setVelocityX(dir * 300);
          player.body.setVelocityY(-300);
          if (this.health <= 0) {
            this.scene.pause();
            showScreen('game-over-screen');
          }
        }

        reachGoal() {
          this.scene.pause();
          showScreen('victory-screen');
        }

        update(_time, delta) {
          const left = this.isDown(this.leftKeys);
          const right = this.isDown(this.rightKeys);

          if (left && !right) {
            this.player.body.setVelocityX(-MOVE_SPEED);
          } else if (right && !left) {
            this.player.body.setVelocityX(MOVE_SPEED);
          } else {
            this.player.body.setVelocityX(0);
          }

          for (let i = 0; i < this.jumpKeys.length; i++) {
            if (Phaser.Input.Keyboard.JustDown(this.jumpKeys[i])) {
              this.tryJump();
              break;
            }
          }

          if (this.player.body.blocked.down) {
            this.jumps = 0;
          }

          this.enemies.getChildren().forEach((enemy) => {
            if (!enemy.patrol) return;
            let dir = enemy.body.velocity.x >= 0 ? 1 : -1;
            if (enemy.x <= enemy.patrol.min) dir = 1;
            else if (enemy.x >= enemy.patrol.max) dir = -1;
            enemy.body.setVelocityX(dir * 120);
          });

          if (this.time.now < this.invincibleUntil) {
            const blink = Math.floor(this.time.now / 80) % 2 === 0;
            this.player.setAlpha(blink ? 0.3 : 0.9);
          } else {
            this.player.setAlpha(1);
          }
        }
      }

      const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        canvas: document.getElementById('game-canvas'),
        width: GAME_W,
        height: GAME_H,
        backgroundColor: '#1a1a2e',
        physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
        scene: [GameScene],
      };

      // ===== ui-init (event binding / bootstrap) =====

      function startGame() {
        if (gameStarted) return;
        gameStarted = true;
        console.log('[ui-init] startGame() invoked');
        hideScreen('start-screen');
        game = new Phaser.Game(config);
        console.log('[ui-init] Phaser.Game started');
      }

      function restartGame() {
        console.log('[ui-init] restartGame() invoked');
        hideScreen('game-over-screen');
        hideScreen('victory-screen');
        if (game) {
          game.scene.stop('game');
          game.scene.start('game');
        } else {
          startGame();
        }
      }

      function bindStartButton() {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
          startBtn.addEventListener('click', startGame);
          console.log('[ui-init] #start-btn click listener bound');
        } else {
          console.error('[ui-init] #start-btn not found in DOM');
        }
      }

      function bindRestartButtons() {
        const restartBtn = document.getElementById('restart-btn');
        const againBtn = document.getElementById('play-again-btn');
        if (restartBtn) restartBtn.addEventListener('click', restartGame);
        if (againBtn) againBtn.addEventListener('click', restartGame);
      }

      function init() {
        console.log('[ui-init] init() running, readyState=' + document.readyState);
        bindStartButton();
        bindRestartButtons();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          console.log('[ui-init] DOMContentLoaded fired');
          init();
        });
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
